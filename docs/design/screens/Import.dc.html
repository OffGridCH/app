  <p style="margin: 8px 24px 0 24px; font-size: 15px; line-height: 1.5; color: #C5CAD6; text-wrap: pretty">Wähle die Export-Datei von deinem alten Handy und gib das Passwort ein.</p>

  <button type="button" style="margin: 22px 16px 0 16px; min-height: 72px; padding: 12px 16px; border-radius: 20px; background: #1A1D24; border: 1px solid #2C313B; color: #EEF0F5; font-family: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>

      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">offgrid-backup.ogx</div>
      <div style="font-size: 13px; color: #959CAB">Andere Datei wählen</div>
    </div>
  </button>

  <form style="margin: 14px 16px 0 16px; border-radius: 20px; background: #1A1D24; border: 1px solid #2C313B; padding: 16px; display: flex; flex-direction: column; gap: 6px">
    <label for="pw" style="font-size: 13px; color: #C5CAD6">Passwort der Export-Datei</label>
    <input id="pw" type="password" value="geheimespasswort" style="height: 46px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2C313B; background: #0F1115; color: #EEF0F5; padding: 0 14px; font-family: inherit; font-size: 16px; outline: none">
  </form>

  <div role="note" style="margin: 14px 16px 0 16px; padding: 14px 16px; border-radius: 18px; background: #2A2220; border: 1px solid #4A3330; display: flex; gap: 12px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB4AD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4"></path><path d="M12 17v.01"></path></svg>

  <div style="padding: 0 16px 26px 16px">
    <a href="Kontakte.dc.html" style="height: 54px; border-radius: 18px; background: #9DB4FF; color: #0B1020; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Importieren</a>
