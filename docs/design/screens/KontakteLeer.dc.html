<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kontakte, leer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#9DB4FF}a:hover{color:#C2D0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #EEF0F5; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 6px 20px">
    <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">OffGrid</div>
    <a href="Einstellungen.dc.html" aria-label="Einstellungen" style="width: 44px; height: 44px; border-radius: 50%; background: #1A1D24; border: 1px solid #2C313B; display: flex; align-items: center; justify-content: center; color: #EEF0F5; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
    </a>
  </header>

  <a href="Antenne.dc.html" style="margin: 0 20px; display: flex; align-items: center; gap: 8px; min-height: 44px; color: #C5CAD6; text-decoration: none; font-size: 14px">
    <div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD6A4"></div>
    <span>Antenne verbunden</span>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #959CAB">· USB-C · 868 MHz</span>
  </a>
  <div style="height: 1px; background: #262A33; margin: 6px 20px 0 20px"></div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 36px">
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 10px">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #1A1D24; border: 1px solid #2C313B; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
        <div style="display: grid; grid-template-columns: repeat(5, 5px); grid-auto-rows: 5px; gap: 1px">
          <sc-for list="{{kMe}}" as="c" hint-placeholder-count="25"><div style="{{c.s}}"></div></sc-for>
        </div>
      </div>
      <div style="display: flex; gap: 6px">
        <div style="width: 5px; height: 5px; border-radius: 50%; background: #3D4350"></div>
        <div style="width: 5px; height: 5px; border-radius: 50%; background: #3D4350"></div>
        <div style="width: 5px; height: 5px; border-radius: 50%; background: #3D4350"></div>
      </div>
      <div style="width: 56px; height: 56px; border-radius: 50%; border: 1.5px dashed #4A5060; box-sizing: border-box"></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Noch keine Kontakte</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #C5CAD6; text-wrap: pretty">Triff dich mit jemandem, der OffGrid nutzt, und scannt gegenseitig eure Codes. Danach könnt ihr ohne Mobilnetz schreiben.</p>
    </div>
  </div>

  <div style="padding: 12px 16px 26px 16px">
    <a href="Handshake.dc.html" style="height: 54px; border-radius: 18px; background: #9DB4FF; color: #0B1020; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 14h3v3"></path><path d="M21 14v7h-7"></path></svg>
      <span>Ersten Kontakt hinzufügen</span>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  keyPattern(seed) {
    var s = seed, g = [];
    function r() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
    for (var y = 0; y < 5; y++) {
      var row = [r() > 0.45, r() > 0.45, r() > 0.45];
      for (var x = 0; x < 5; x++) {
        var on = row[x < 3 ? x : 4 - x];
        g.push({ s: on ? 'background:#C5CAD6;border-radius:1px' : 'background:transparent' });
      }
    }
    return g;
  }
  renderVals() {
    return { kMe: this.keyPattern(91) };
  }
}
</script>
</body>
</html>
