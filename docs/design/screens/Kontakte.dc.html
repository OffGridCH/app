<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  keyPattern(seed) {
    var s = seed, g = [];
    function r() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
    for (var y = 0; y < 5; y++) {
      var row = [r() > 0.45, r() > 0.45, r() > 0.45];
      for (var x = 0; x < 5; x++) {
        var on = row[x < 3 ? x : 4 - x];
        g.push({ s: on ? 'background:#C5CAD6;border-radius:1px' : 'background:transparent' });
      }
    }
    return g;
  }
  renderVals() {
    return { kAnna: this.keyPattern(11), kLuca: this.keyPattern(58), kMia: this.keyPattern(203) };
  }
}
</script>
