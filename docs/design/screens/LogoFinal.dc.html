<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OffGrid Logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#9DB4FF}a:hover{color:#C2D0FF}
</style>
</helmet>
<div style="width: 1360px; height: 860px; box-sizing: border-box; background: #0B0D10; color: #EEF0F5; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; padding: 40px; display: grid; grid-template-columns: 520px minmax(0, 1fr) 260px; gap: 32px">

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <symbol id="og-mark" viewBox="0 0 100 100">
        <rect x="14" y="18" width="72" height="56" rx="18" fill="#9DB4FF"></rect>
        <path d="M24 66 L20 87 L46 72 Z" fill="#9DB4FF"></path>
        <g fill="#0B1020" opacity="0.16">
          <rect x="29.5" y="25.5" width="8" height="8" rx="2"></rect><rect x="40.5" y="25.5" width="8" height="8" rx="2"></rect><rect x="51.5" y="25.5" width="8" height="8" rx="2"></rect>
          <rect x="29.5" y="36.5" width="8" height="8" rx="2"></rect><rect x="40.5" y="36.5" width="8" height="8" rx="2"></rect>
          <rect x="29.5" y="47.5" width="8" height="8" rx="2"></rect>
        </g>
        <g fill="#0B1020">
          <rect x="62.5" y="25.5" width="8" height="8" rx="2"></rect>
          <rect x="51.5" y="36.5" width="8" height="8" rx="2"></rect><rect x="62.5" y="36.5" width="8" height="8" rx="2"></rect>
          <rect x="40.5" y="47.5" width="8" height="8" rx="2"></rect><rect x="51.5" y="47.5" width="8" height="8" rx="2"></rect><rect x="62.5" y="47.5" width="8" height="8" rx="2"></rect>
          <rect x="29.5" y="58.5" width="8" height="8" rx="2"></rect><rect x="40.5" y="58.5" width="8" height="8" rx="2"></rect><rect x="51.5" y="58.5" width="8" height="8" rx="2"></rect><rect x="62.5" y="58.5" width="8" height="8" rx="2"></rect>
        </g>
      </symbol>
      <symbol id="og-mark-inv" viewBox="0 0 100 100">
        <rect x="14" y="18" width="72" height="56" rx="18" fill="#0F1115"></rect>
        <path d="M24 66 L20 87 L46 72 Z" fill="#0F1115"></path>
        <g fill="#9DB4FF" opacity="0.2">
          <rect x="29.5" y="25.5" width="8" height="8" rx="2"></rect><rect x="40.5" y="25.5" width="8" height="8" rx="2"></rect><rect x="51.5" y="25.5" width="8" height="8" rx="2"></rect>
          <rect x="29.5" y="36.5" width="8" height="8" rx="2"></rect><rect x="40.5" y="36.5" width="8" height="8" rx="2"></rect>
          <rect x="29.5" y="47.5" width="8" height="8" rx="2"></rect>
        </g>
        <g fill="#9DB4FF">
          <rect x="62.5" y="25.5" width="8" height="8" rx="2"></rect>
          <rect x="51.5" y="36.5" width="8" height="8" rx="2"></rect><rect x="62.5" y="36.5" width="8" height="8" rx="2"></rect>
          <rect x="40.5" y="47.5" width="8" height="8" rx="2"></rect><rect x="51.5" y="47.5" width="8" height="8" rx="2"></rect><rect x="62.5" y="47.5" width="8" height="8" rx="2"></rect>
          <rect x="29.5" y="58.5" width="8" height="8" rx="2"></rect><rect x="40.5" y="58.5" width="8" height="8" rx="2"></rect><rect x="51.5" y="58.5" width="8" height="8" rx="2"></rect><rect x="62.5" y="58.5" width="8" height="8" rx="2"></rect>
        </g>
      </symbol>
    </defs>
  </svg>

  <section style="background: #0F1115; border: 1px solid #262A33; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 28px">
    <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #959CAB; letter-spacing: 0.12em">APP-ICON</div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
      <svg width="320" height="320" viewBox="0 0 100 100" role="img" aria-label="OffGrid App-Icon"><rect x="0.5" y="0.5" width="99" height="99" rx="23" fill="#0F1115" stroke="#2C313B" stroke-width="0.5"></rect><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
    </div>
    <div style="font-size: 14px; line-height: 1.5; color: #C5CAD6">Signalbalken aus Rasterzellen: Die Zellen ergeben das Grid, die gefüllten Zellen zeigen den Empfang.</div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 32px">
    <div style="background: #0F1115; border: 1px solid #262A33; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 28px; flex-grow: 1">
      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #959CAB; letter-spacing: 0.12em">LOGO MIT SCHRIFTZUG</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 16px">
        <svg width="76" height="76" viewBox="10 14 80 80" aria-hidden="true"><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
        <div style="font-size: 60px; font-weight: 800; letter-spacing: -0.035em">OffGrid</div>
      </div>
    </div>
    <div style="background: #9DB4FF; border-radius: 28px; padding: 36px; display: flex; align-items: center; justify-content: center; gap: 14px; height: 200px; box-sizing: border-box">
      <svg width="60" height="60" viewBox="10 14 80 80" aria-hidden="true"><use href="#og-mark-inv" x="0" y="0" width="100" height="100"></use></svg>
      <div style="font-size: 48px; font-weight: 800; letter-spacing: -0.035em; color: #0B1020">OffGrid</div>
    </div>
  </section>

  <section style="background: #0F1115; border: 1px solid #262A33; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 26px; align-items: center">
    <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #959CAB; letter-spacing: 0.12em; align-self: flex-start">GRÖSSEN</div>
    <div style="width: 120px; height: 120px; border-radius: 50%; overflow: hidden; background: #0F1115; border: 1px solid #2C313B; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="92" height="92" viewBox="0 0 100 100" aria-hidden="true"><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 16px">
      <svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><rect x="0.5" y="0.5" width="99" height="99" rx="23" fill="#0F1115" stroke="#2C313B"></rect><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
      <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect x="0.5" y="0.5" width="99" height="99" rx="23" fill="#0F1115" stroke="#2C313B"></rect><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
      <svg width="24" height="24" viewBox="10 14 80 80" aria-hidden="true"><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
    </div>
    <div style="width: 180px; height: 360px; border-radius: 28px; background: #0F1115; border: 1px solid #2C313B; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-top: auto">
      <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><use href="#og-mark" x="0" y="0" width="100" height="100"></use></svg>
      <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.035em">OffGrid</div>
      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; color: #959CAB; letter-spacing: 0.12em">SPLASH</div>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
