<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Daten exportieren</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#9DB4FF}a:hover{color:#C2D0FF}
input::placeholder{color:#8A91A0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #EEF0F5; font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 6px; padding: 14px 12px 8px 6px">
    <a href="Einstellungen.dc.html" aria-label="Zurück zu den Einstellungen" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EEF0F5; border-radius: 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Daten exportieren</h1>
  </header>

  <p style="margin: 8px 24px 0 24px; font-size: 15px; line-height: 1.5; color: #C5CAD6; text-wrap: pretty">Für den Wechsel auf ein neues Handy. Die Datei enthält deine Schlüssel, darum wird sie mit einem Passwort verschlüsselt.</p>

  <div style="margin: 22px 16px 0 16px; border-radius: 20px; background: #1A1D24; border: 1px solid #2C313B; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; border-bottom: 1px solid #262A33">
      <div style="font-size: 15px; color: #C5CAD6">Kontakte und Schlüssel</div>
      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">4</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px">
      <div style="font-size: 15px; color: #C5CAD6">Nachrichten</div>
      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">128</div>
    </div>
  </div>

  <form style="margin: 14px 16px 0 16px; border-radius: 20px; background: #1A1D24; border: 1px solid #2C313B; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw1" style="font-size: 13px; color: #C5CAD6">Passwort</label>
      <input id="pw1" type="password" value="geheimespasswort" style="height: 46px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2C313B; background: #0F1115; color: #EEF0F5; padding: 0 14px; font-family: inherit; font-size: 16px; outline: none">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw2" style="font-size: 13px; color: #C5CAD6">Passwort wiederholen</label>
      <input id="pw2" type="password" value="geheimespasswort" style="height: 46px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2C313B; background: #0F1115; color: #EEF0F5; padding: 0 14px; font-family: inherit; font-size: 16px; outline: none">
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#959CAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>
      <div style="font-size: 13px; line-height: 1.45; color: #959CAB">Ohne Passwort lässt sich die Datei nicht mehr öffnen. Es gibt keine Wiederherstellung.</div>
    </div>
  </form>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 16px 26px 16px">
    <button type="button" style="width: 100%; height: 54px; border: none; border-radius: 18px; background: #9DB4FF; color: #0B1020; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"></path></svg>
      <span>Datei erstellen und teilen</span>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
